  <text x="44" y="250" fill="#34D399" font-size="12.5" font-weight="700">해일님, 안심하세요! 8시 48분이라 여유 있습니다.</text>
  
  <text x="44" y="276" fill="#E2E8F0" font-size="12.5" font-weight="700">1. 방향 교정 &amp; 최신 트리 우회:</text>
